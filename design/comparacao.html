<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:2080px;background:#2B2C2E;font-family:'Atkinson Hyperlegible',sans-serif;color:#fff;padding:40px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:32px}
h2{font-size:30px;margin-bottom:6px}
p{font-size:18px;color:#C9CACC;margin-bottom:16px;line-height:1.4}
.frame{height:1500px;overflow:hidden;border-radius:12px}
img{width:200%;display:block;transform-origin:top left}
.a img{margin-left:-100%}
.b img{margin-left:-100%}
</style></head><body><div class="row">
<div><h2>A · Papel e serifa</h2><p>Calmo e elegante. Bom gosto, mas é uma estética que hoje muita IA também gera.</p>
<div class="frame a"><img src="mockup-redesign.png"></div></div>
<div><h2>B · Placas de trânsito</h2><p>Código visual que a pessoa já domina. Mais memorável e com justificativa forte para a banca.</p>
<div class="frame b"><img src="mockup-placas.png"></div></div>
</div></body></html>
